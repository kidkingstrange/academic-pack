<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block subject %}Academic Comeback{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f9f9f9;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f9f9f9;padding:36px 16px">
  <tr><td align="center">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e5e5e5;border-radius:0;overflow:hidden">
      <!-- Header -->
      <tr><td style="background:#0a0a0a;padding:24px 32px;text-align:center;border-bottom:1px solid #e5e5e5">
        <p style="color:#8c8c8c;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin:0 0 6px">SCALE GROUP</p>
        <p style="color:#ffffff;margin:0;font-size:18px;font-weight:600;letter-spacing:-0.03em">The First Class Project</p>
      </td></tr>
      <!-- Body -->
      <tr><td style="padding:32px 32px 24px;background:#ffffff">
        {% block content %}{% endblock %}
      </td></tr>
      <!-- Footer -->
      <tr><td style="background:#ffffff;padding:24px 32px;text-align:center;border-top:1px solid #e5e5e5">
        <p style="color:#8c8c8c;font-size:11px;margin:0 0 6px">You're receiving this because you joined the Academic Comeback community.</p>
        <p style="color:#8c8c8c;font-size:11px;margin:0">
          <a href="{{ app_url }}/unsubscribe?token={{ unsubscribe_token }}" style="color:#0a0a0a;font-weight:600;text-decoration:underline">Unsubscribe</a> · © 2026 Scale Group
        </p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
