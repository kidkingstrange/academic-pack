<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Scale Group</title>
<meta name="description" content="Sign in to the Scale Group administrative command center to manage sales, customer access, affiliate payouts, and system operations.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/main.css?v=swiss-20261008">
<link rel="stylesheet" href="/css/landing.css?v=swiss-20261008">
<style>
  :root {
    --surface: #f9f9f9;
    --surface-container-lowest: #ffffff;
    --border-hairline: #e5e5e5;
    --border-subtle: #cccccc;
    --text-primary: #0a0a0a;
    --text-secondary: #595959;
    --action-primary: #0a0a0a;
    --action-hover: #262626;
  }

  body {
    background: #f9f9f9;
    color: #0a0a0a;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  .auth-page-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    box-sizing: border-box;
  }

  .auth-card {
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    max-width: 440px;
    width: 100%;
    padding: 40px 32px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.02);
    box-sizing: border-box;
    position: relative;
  }

  .badge-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(10, 10, 10, 0.06);
    border: 1px solid rgba(10, 10, 10, 0.15);
    color: #0a0a0a;
    font-size: .72rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 9999px;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  h1.auth-title {
    font-family: 'Inter', sans-serif;
    font-size: 1.65rem;
    font-weight: 800;
    color: #0a0a0a;
    text-align: center;
    margin: 0 0 8px 0;
    letter-spacing: -0.035em;
    line-height: 1.25;
  }

  .auth-sub {
    font-size: .92rem;
    color: #595959;
    text-align: center;
    line-height: 1.55;
    margin: 0 0 24px 0;
  }

  .form-group {
    margin-bottom: 18px;
    text-align: left;
  }

  .form-group label {
    display: block;
    font-size: .74rem;
    font-weight: 700;
    color: #595959;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrap input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    color: #0a0a0a;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.18s, box-shadow 0.18s;
  }

  .input-wrap input:focus {
    border-color: #0a0a0a;
    box-shadow: 0 0 0 1px #0a0a0a;
  }

  .toggle-pwd-btn {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: #71717a;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 4px;
    display: flex;
    align-items: center;
  }

  .toggle-pwd-btn:hover { color: #0a0a0a; }

  .btn-submit {
    width: 100%;
    padding: 14px 20px;
    background: #0a0a0a;
    color: #ffffff;
    border: 1px solid #0a0a0a;
    border-radius: 9999px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all .18s;
    font-family: inherit;
    margin-top: 24px;
  }

  .btn-submit:hover:not(:disabled) {
    background: #262626;
    border-color: #262626;
  }

  .btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .login-err {
    background: rgba(220, 38, 38, 0.08);
    border: 1px solid rgba(220, 38, 38, 0.2);
    color: #b91c1c;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-top: 16px;
    text-align: center;
    display: none;
  }

  .auth-footer {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #e5e5e5;
    text-align: center;
    font-size: 0.82rem;
    color: #71717a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  @media (max-width: 480px) {
    .auth-page-wrapper { padding: 24px 14px; }
    .auth-card { padding: 28px 20px; border-radius: 14px; }
    h1.auth-title { font-size: 1.35rem; }
  }
</style>
</head>
<body>

<!-- Unified Global Site Header -->
<header class="global-site-header">
  <div class="global-header-inner">
    <a href="/" class="global-brand">
      <img src="/assets/images/scale-logo-cutout.png" alt="Scale Group Logo" width="24" height="28">
      <span>SCALE GROUP</span>
    </a>
    <nav class="global-nav">
      <a href="/academic-comeback-package" class="global-nav__flagship">
        <span class="global-nav__flagship-dot"></span>
        <i class="bi bi-mortarboard-fill"></i> Academic Comeback
      </a>
      <a href="/#masterclasses" class="global-nav__link">Masterclasses</a>
      <a href="/blog/" class="global-nav__link">Campus Guides</a>
      <a href="/library" class="global-nav__link">My Library</a>
      <a href="/" class="global-nav__link">Website Home</a>
    </nav>
    <div class="global-header-mobile-actions">
      <a href="/" class="global-nav__link" style="font-size:0.85rem; font-weight:600; text-decoration:none; color:var(--text-primary);">
        <i class="bi bi-arrow-left"></i> Home
      </a>
    </div>
  </div>
</header>

<div class="auth-page-wrapper">
  <div class="auth-card">
    <div style="text-align: center;"><span class="badge-tag"><i class="bi bi-shield-lock-fill"></i> Admin Command</span></div>
    <h1 class="auth-title">Admin Access</h1>
    <p class="auth-sub">Sign in to manage sales, customers, affiliates, and digital products.</p>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="admin@scalegroup.com" required autocomplete="email">
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter your password" minlength="6" required autocomplete="current-password">
          <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Login to Command Center →</button>
      <div class="login-err" id="error-msg">Invalid credentials</div>
    </form>

    <div class="auth-footer">
      <i class="bi bi-shield-check"></i> Encrypted administrative access session
    </div>
  </div>
</div>

<script>
  function formatApiError(detail, fallback) {
    fallback = fallback || 'Something went wrong. Please try again.';
    if (!detail) return fallback;
    if (typeof detail === 'string') return detail;
    if (Array.isArray(detail)) {
      const msgs = detail.map(d => (d && typeof d === 'object' && d.msg) ? d.msg : String(d));
      return msgs.filter(Boolean).join(' ') || fallback;
    }
    return fallback;
  }

  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    const icon = btn.querySelector('i');
    if (icon) {
      icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
    }
  }

  if(sessionStorage.getItem('admin_token')) window.location.href = '/admin/dashboard';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const err = document.getElementById('error-msg');

    btn.disabled = true;
    btn.textContent = 'Authenticating...';
    err.style.display = 'none';

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(formatApiError(data.detail, 'Login failed'));

      sessionStorage.setItem('admin_token', data.access_token);
      window.location.href = '/admin/dashboard';
    } catch (error) {
      err.textContent = error.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Login to Command Center →';
    }
  });
</script>
</body>
</html>
