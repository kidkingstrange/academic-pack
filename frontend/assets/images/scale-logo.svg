<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Scale Group">
  <defs>
    <linearGradient id="scaleLogoChevron1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a87830"/>
      <stop offset="50%" stop-color="#f0c96a"/>
      <stop offset="100%" stop-color="#c9973a"/>
    </linearGradient>
    <linearGradient id="scaleLogoChevron2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8a611f"/>
      <stop offset="50%" stop-color="#e3b55a"/>
      <stop offset="100%" stop-color="#a87830"/>
    </linearGradient>
    <linearGradient id="scaleLogoBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c96a"/>
      <stop offset="100%" stop-color="#c9973a"/>
    </linearGradient>
  </defs>

  <!-- Top chevron: wide ribbon band, peak at top-center, flat vertical end caps -->
  <polygon points="12,40 50,12 88,40 88,54 50,26 12,54" fill="url(#scaleLogoChevron1)"/>

  <!-- Bottom chevron: same band, offset down -->
  <polygon points="12,60 50,34 88,60 88,74 50,46 12,74" fill="url(#scaleLogoChevron2)"/>

  <!-- Gold base: solid lens/eye shape -->
  <path d="M12 68 Q50 78 88 68 Q50 96 12 68 Z" fill="url(#scaleLogoBase)"/>
</svg>
